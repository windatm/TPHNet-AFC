# conda env create -f environment.yml
# conda activate malware-clf
# pip install -e ".[dev]"

name: malware-clf
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pytorch>=2.2
  - pytorch-cuda=12.4
  - numpy>=1.23
  - pandas>=1.5
  - scikit-learn>=1.1
  - scipy>=1.9
  - pyarrow>=12
  - pyyaml>=6
  - tqdm>=4.64
  - pip
  - pip:
      - transformers>=4.30
      - accelerate>=0.27
